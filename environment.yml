# Conda environment for the Zambia explicit-peak OnSSET experiment.
#   conda env create -f environment.yml
#   conda activate zambia-peak
name: zambia-peak
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - pyyaml>=6.0
  - openpyxl>=3.1
  - matplotlib>=3.7
  - rasterio>=1.3
  - pyogrio>=0.7
  - shapely>=2.0
  - geopandas>=0.14
  - pip

# OnSSET is not installed from PyPI. Build it from upstream commit c154ece with the
# patch in patches/ applied — see REPRODUCING.md. An unpatched engine does not
# reproduce the published results.
